[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 10000

[invariant]
runs = 512
depth = 64
fail_on_revert = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
creditcoin = "https://rpc.cc3-testnet.creditcoin.network"
